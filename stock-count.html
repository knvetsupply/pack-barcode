<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Count — KN Vet Supply</title>
<style>
  :root {
    --bg: #f8f9fa;
    --surface: #ffffff;
    --border: #e2e8f0;
    --text1: #1a202c;
    --text2: #4a5568;
    --text3: #a0aec0;
    --green: #38a169;
    --green-bg: #f0fff4;
    --green-bd: #c6f6d5;
    --red: #e53e3e;
    --red-bg: #fff5f5;
    --red-bd: #fed7d7;
    --blue: #3182ce;
    --blue-bg: #ebf8ff;
    --mono: 'Courier New', monospace;
    --sans: -apple-system, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--sans); background: var(--bg); color: var(--text1); min-height: 100vh; }

  /* Header */
  .hd {
    background: #1a202c;
    color: #fff;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .hd-logo { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; }
  .hd-logo span { color: #68d391; }
  .hd-right { display: flex; align-items: center; gap: 10px; }
  .hd-emp { font-size: 12px; color: rgba(255,255,255,0.7); cursor: pointer; }
  .hd-emp span { color: #68d391; font-weight: 600; }
  .btn-sm {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 12px;
    cursor: pointer;
    font-family: var(--sans);
  }
  .btn-sm:hover { background: rgba(255,255,255,0.2); }
  .btn-sm.danger { background: rgba(229,62,62,0.3); border-color: rgba(229,62,62,0.5); }

  /* Layout */
  .layout { display: grid; grid-template-columns: 1fr 360px; height: calc(100vh - 52px); }

  /* Left panel */
  .main { display: flex; flex-direction: column; overflow: hidden; }

  /* Mode bar */
  .mode-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .mode-label { font-size: 13px; color: var(--text2); font-weight: 500; }
  .mode-toggle {
    display: flex;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .mode-btn {
    padding: 7px 18px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    background: none;
    color: var(--text2);
    font-family: var(--sans);
    transition: all 0.15s;
  }
  .mode-btn.active-in { background: var(--green); color: #fff; }
  .mode-btn.active-out { background: var(--red); color: #fff; }

  /* Scan area */
  .scan-area {
    padding: 16px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .scan-input {
    flex: 1;
    padding: 11px 14px;
    border: 2px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    font-family: var(--mono);
    outline: none;
    transition: border-color 0.15s;
  }
  .scan-input:focus { border-color: var(--blue); }
  .scan-input::placeholder { font-family: var(--sans); color: var(--text3); }

  /* Item list */
  .item-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px 20px;
  }
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text3);
    gap: 10px;
    text-align: center;
  }
  .empty-icon { font-size: 40px; }
  .empty-text { font-size: 14px; line-height: 1.6; }

  .item-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 0;
    overflow: hidden;
  }
  .item-type-bar {
    width: 5px;
    align-self: stretch;
    flex-shrink: 0;
  }
  .item-type-bar.in { background: var(--green); }
  .item-type-bar.out { background: var(--red); }
  .item-body {
    flex: 1;
    padding: 12px 14px;
    min-width: 0;
  }
  .item-name { font-size: 14px; font-weight: 600; color: var(--text1); }
  .item-bc { font-size: 11px; color: var(--text3); font-family: var(--mono); margin-top: 2px; }
  .item-detail { font-size: 12px; color: var(--text2); margin-top: 4px; }
  .item-right {
    padding: 12px 16px;
    text-align: right;
    flex-shrink: 0;
  }
  .item-pieces {
    font-size: 20px;
    font-weight: 800;
    font-family: var(--mono);
    color: var(--text1);
  }
  .item-unit { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .item-del {
    background: none;
    border: none;
    color: var(--text3);
    cursor: pointer;
    padding: 12px 10px;
    font-size: 16px;
    align-self: stretch;
  }
  .item-del:hover { color: var(--red); background: var(--red-bg); }

  /* Footer */
  .footer {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .footer-stats { font-size: 13px; color: var(--text2); }
  .footer-stats strong { color: var(--text1); font-size: 15px; }
  .btn-save {
    background: var(--green);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 11px 28px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: var(--sans);
    transition: opacity 0.15s;
  }
  .btn-save:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-save.out-mode { background: var(--red); }
  .btn-clear {
    background: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 18px;
    font-size: 13px;
    color: var(--text2);
    cursor: pointer;
    font-family: var(--sans);
  }

  /* Right panel — Log */
  .log-panel {
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    background: var(--surface);
    overflow: hidden;
  }
  .log-hd {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .log-title { font-size: 12px; font-weight: 700; color: var(--text2); letter-spacing: 0.08em; text-transform: uppercase; }
  .log-list { flex: 1; overflow-y: auto; padding: 8px; }
  .log-entry {
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 4px;
    border-left: 3px solid transparent;
  }
  .log-entry.in { background: var(--green-bg); border-color: var(--green); }
  .log-entry.out { background: var(--red-bg); border-color: var(--red); }
  .log-entry.err { background: #fff5f5; border-color: var(--red); }
  .log-entry.saved { background: var(--blue-bg); border-color: var(--blue); }
  .log-bc { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--text1); }
  .log-msg { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .log-time { font-size: 10px; color: var(--text3); margin-top: 3px; font-family: var(--mono); }

  /* Modals */
  .modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(0,0,0,0.8);
    align-items: center;
    justify-content: center;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: #fff;
    border-radius: 16px;
    padding: 28px 32px;
    max-width: 360px;
    width: 90%;
    text-align: center;
    box-shadow: 0 8px 40px rgba(0,0,0,0.3);
  }
  .modal-icon { font-size: 36px; margin-bottom: 12px; }
  .modal-title { font-size: 17px; font-weight: 700; color: var(--text1); margin-bottom: 6px; }
  .modal-sub { font-size: 13px; color: var(--text2); margin-bottom: 20px; line-height: 1.5; }
  .modal-input {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    font-family: var(--sans);
    outline: none;
    margin-bottom: 12px;
  }
  .modal-input:focus { border-color: var(--blue); }
  .btn-modal {
    width: 100%;
    padding: 12px;
    background: var(--text1);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: var(--sans);
  }
  .modal-select {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    font-family: var(--sans);
    outline: none;
    margin-bottom: 12px;
    background: #fff;
    cursor: pointer;
  }

  /* Settings */
  .settings-grid { display: flex; flex-direction: column; gap: 10px; text-align: left; margin-bottom: 16px; }
  .settings-label { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 4px; }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #1a202c;
    color: #fff;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.2s;
    z-index: 99999;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- Header -->
<div class="hd">
  <div class="hd-logo">Stock<span>Count</span> · KN Vet Supply</div>
  <div class="hd-right">
    <div class="hd-emp" onclick="changeEmployee()" title="คลิกเพื่อเปลี่ยน">
      👤 <span id="empName">—</span>
    </div>
    <button class="btn-sm" onclick="showSettings()">⚙ ตั้งค่า</button>
    <button class="btn-sm danger" onclick="logoutEmployee()">🔒 ออก</button>
  </div>
</div>

<!-- Layout -->
<div class="layout">
  <!-- Main -->
  <div class="main">
    <!-- Mode bar -->
    <div class="mode-bar">
      <span class="mode-label">โหมด:</span>
      <div class="mode-toggle">
        <button class="mode-btn active-in" id="btnIn" onclick="setMode('in')">📥 รับเข้า</button>
        <button class="mode-btn" id="btnOut" onclick="setMode('out')">📤 ขายออก</button>
      </div>
      <div id="channelWrap" style="margin-left:auto;display:flex;align-items:center;gap:8px;">
        <span style="font-size:13px;color:var(--text2);">ช่องทาง:</span>
        <select id="channelSel" style="font-size:13px;padding:6px 10px;border:1px solid var(--border);border-radius:8px;font-family:var(--sans);background:#fff;cursor:pointer;">
          <option value="FlowAccount">FlowAccount</option>
          <option value="Shopee">Shopee</option>
          <option value="WooCommerce">WooCommerce</option>
          <option value="LINE">LINE OA</option>
          <option value="อื่นๆ">อื่นๆ</option>
        </select>
        <input id="refInput" type="text" placeholder="เลขที่ Invoice/Order (ถ้ามี)"
          style="font-size:13px;padding:6px 10px;border:1px solid var(--border);border-radius:8px;font-family:var(--sans);width:180px;outline:none;">
      </div>
    </div>

    <!-- Scan -->
    <div class="scan-area">
      <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
        <span style="font-size:13px;color:var(--text2);white-space:nowrap;">จำนวน</span>
        <input type="number" id="qtyInput" value="1" min="1" max="9999"
          style="width:70px;padding:11px 10px;border:2px solid var(--border);border-radius:10px;font-size:15px;font-weight:700;text-align:center;font-family:var(--mono);outline:none;"
          onfocus="this.select()"
          onkeydown="if(event.key==='Enter'){document.getElementById('scanInput').focus();}" />
        <span style="font-size:13px;color:var(--text2);">หน่วย</span>
      </div>
      <input type="text" id="scanInput" class="scan-input"
        placeholder="สแกนบาร์โค้ดสินค้า..."
        autocomplete="off" disabled
        onkeydown="if(event.key==='Enter'){var v=this.value.trim();if(v){processScan(v);this.value='';}}" />
    </div>

    <!-- Items -->
    <div class="item-list" id="itemList">
      <div class="empty-state">
        <div class="empty-icon">📦</div>
        <div class="empty-text">เข้าสู่ระบบก่อน<br>แล้วสแกนบาร์โค้ดสินค้าได้เลย</div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <div class="footer-stats" id="footerStats">ยังไม่มีรายการ</div>
      <div style="display:flex;gap:8px;">
        <button class="btn-clear" onclick="clearAll()">ล้าง</button>
        <button class="btn-save" id="btnSave" disabled onclick="saveAll()">💾 บันทึกสต็อก</button>
      </div>
    </div>
  </div>

  <!-- Log panel -->
  <div class="log-panel">
    <div class="log-hd">
      <div class="log-title">ประวัติการสแกน</div>
      <button class="btn-sm" onclick="clearLog()">ล้าง</button>
    </div>
    <div class="log-list" id="logList">
      <div style="text-align:center;padding:30px;color:var(--text3);font-size:13px;">ยังไม่มีประวัติ</div>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Employee Modal -->
<div class="modal-bg show" id="empModal">
  <div class="modal">
    <div class="modal-icon">👤</div>
    <div class="modal-title">ระบุชื่อพนักงาน</div>
    <div class="modal-sub">เพื่อบันทึก Stock Log</div>
    <input type="text" id="empInput" class="modal-input" placeholder="ชื่อ-นามสกุล หรือชื่อเล่น"
      onkeydown="if(event.key==='Enter')saveEmployee()">
    <button class="btn-modal" onclick="saveEmployee()">✅ เข้าสู่ระบบ</button>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-bg" id="settingsModal">
  <div class="modal" style="max-width:420px;">
    <div class="modal-title" style="text-align:left;margin-bottom:16px;">⚙ ตั้งค่า Worker</div>
    <div class="settings-grid">
      <div>
        <div class="settings-label">Worker URL</div>
        <input type="text" class="modal-input" id="cfgWorker" placeholder="https://xxx.workers.dev" style="margin:0;">
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button class="btn-modal" style="background:var(--green);" onclick="saveSettings()">บันทึก</button>
      <button class="btn-modal" style="background:var(--border);color:var(--text1);" onclick="document.getElementById('settingsModal').classList.remove('show')">ยกเลิก</button>
    </div>
  </div>
</div>

<script>
// ── Config ────────────────────────────────────────────
var cfg = JSON.parse(localStorage.getItem('scCfg') || '{"workerUrl":""}');
var currentEmployee = '';
var mode = 'in';
var items = []; // { name, barcode, piecesPerUnit, qty, totalPieces }
var logEmpty = true;
var _autoTimer = null;

function saveSettings() {
  cfg.workerUrl = document.getElementById('cfgWorker').value.trim().replace(/\/+$/, '');
  localStorage.setItem('scCfg', JSON.stringify(cfg));
  document.getElementById('settingsModal').classList.remove('show');
  toast('บันทึกแล้ว');
}

function showSettings() {
  document.getElementById('cfgWorker').value = cfg.workerUrl || '';
  document.getElementById('settingsModal').classList.add('show');
}

// ── Employee ──────────────────────────────────────────
function saveEmployee() {
  var name = (document.getElementById('empInput').value || '').trim();
  if (!name) {
    document.getElementById('empInput').style.borderColor = '#e53e3e';
    return;
  }
  currentEmployee = name;
  document.getElementById('empName').textContent = name;
  document.getElementById('empModal').style.display = 'none';
  document.getElementById('scanInput').disabled = false;
  document.getElementById('scanInput').focus();
  _resetTimer();
  toast('ยินดีต้อนรับ ' + name);
}

function changeEmployee() { _lockSystem(); }
function logoutEmployee() { if (confirm('ออกจากระบบ?')) _lockSystem(); }

function _lockSystem() {
  if (_autoTimer) { clearTimeout(_autoTimer); _autoTimer = null; }
  currentEmployee = '';
  document.getElementById('empName').textContent = '—';
  document.getElementById('scanInput').disabled = true;
  var m = document.getElementById('empModal');
  m.style.display = 'flex';
  m.style.cssText = 'display:flex;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.8);align-items:center;justify-content:center;';
  document.getElementById('empInput').value = '';
  setTimeout(function() { document.getElementById('empInput').focus(); }, 100);
}

function _resetTimer() {
  if (_autoTimer) clearTimeout(_autoTimer);
  if (!currentEmployee) return;
  _autoTimer = setTimeout(function() {
    toast('ไม่มีการใช้งาน 30 นาที — กรุณาล็อกอินใหม่');
    _lockSystem();
  }, 1800000);
}

// ── Mode ──────────────────────────────────────────────
function setMode(m) {
  mode = m;
  document.getElementById('btnIn').className = 'mode-btn' + (m === 'in' ? ' active-in' : '');
  document.getElementById('btnOut').className = 'mode-btn' + (m === 'out' ? ' active-out' : '');
  document.getElementById('btnSave').className = 'btn-save' + (m === 'out' ? ' out-mode' : '');
  document.getElementById('btnSave').textContent = m === 'in' ? '💾 บันทึกรับเข้า' : '💾 บันทึกขายออก';
}

// ── Scan ──────────────────────────────────────────────
function barcodeVariants(raw) {
  var s = raw.trim();
  var v = [s];
  if (/^01\d/.test(s) && s.length > 15) {
    v.push(s.substring(0, 15));
    v.push(s.substring(2, 16));
    v.push(s.substring(2, 15));
  }
  return v;
}

async function processScan(rawBarcode) {
  if (!cfg.workerUrl) {
    toast('⚠️ ยังไม่ได้ตั้งค่า Worker URL');
    showSettings();
    return;
  }

  _resetTimer();
  var variants = barcodeVariants(rawBarcode);
  var found = null;

  for (var i = 0; i < variants.length; i++) {
    try {
      var r = await fetch(cfg.workerUrl + '/api/stock/lookup?barcode=' + encodeURIComponent(variants[i]));
      if (r.ok) {
        found = await r.json();
        found.matchedBarcode = variants[i];
        break;
      }
    } catch(e) {}
  }

  if (!found) {
    addLog('err', rawBarcode, 'ไม่พบสินค้าในระบบ');
    toast('❌ ไม่พบบาร์โค้ดนี้ใน Sheet');
    return;
  }

  // อ่านจำนวนจากช่อง qty
  var qtyEl = document.getElementById('qtyInput');
  var scanQty = Math.max(1, parseInt(qtyEl.value) || 1);

  // เช็คว่ามีในรายการแล้วไหม
  var existing = items.find(function(it) { return it.barcode === found.matchedBarcode; });
  if (existing) {
    existing.qty += scanQty;
    existing.totalPieces = existing.qty * existing.piecesPerUnit;
  } else {
    items.push({
      name: found.name,
      barcode: found.matchedBarcode,
      piecesPerUnit: found.piecesPerUnit,
      qty: scanQty,
      totalPieces: scanQty * found.piecesPerUnit
    });
  }

  var curQty = existing ? existing.qty : scanQty;
  var curPieces = existing ? existing.totalPieces : scanQty * found.piecesPerUnit;
  addLog(mode, found.matchedBarcode, found.name + ' — ' + curQty + ' หน่วย × ' + found.piecesPerUnit + ' = ' + curPieces + ' ชิ้น');

  // reset qty กลับเป็น 1 หลังสแกน
  qtyEl.value = 1;
  renderItems();
}

// ── Render ────────────────────────────────────────────
function renderItems() {
  var list = document.getElementById('itemList');
  if (!items.length) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">📦</div><div class="empty-text">สแกนบาร์โค้ดสินค้าได้เลยครับ</div></div>';
    document.getElementById('footerStats').textContent = 'ยังไม่มีรายการ';
    document.getElementById('btnSave').disabled = true;
    return;
  }

  var totalPieces = items.reduce(function(s, it) { return s + it.totalPieces; }, 0);
  document.getElementById('footerStats').innerHTML = '<strong>' + items.length + ' รายการ</strong> · รวม <strong>' + totalPieces.toLocaleString() + ' ชิ้น</strong>';
  document.getElementById('btnSave').disabled = false;

  list.innerHTML = items.map(function(it, idx) {
    return '<div class="item-card">'
      + '<div class="item-type-bar ' + mode + '"></div>'
      + '<div class="item-body">'
      + '<div class="item-name">' + it.name + '</div>'
      + '<div class="item-bc">' + it.barcode + '</div>'
      + '<div class="item-detail">' + it.qty + ' หน่วย × ' + it.piecesPerUnit + ' ชิ้น</div>'
      + '</div>'
      + '<div class="item-right">'
      + '<div class="item-pieces">' + it.totalPieces.toLocaleString() + '</div>'
      + '<div class="item-unit">ชิ้น</div>'
      + '</div>'
      + '<button class="item-del" onclick="removeItem(' + idx + ')" title="ลบ">✕</button>'
      + '</div>';
  }).join('');
}

function removeItem(idx) {
  items.splice(idx, 1);
  renderItems();
}

function clearAll() {
  if (items.length && !confirm('ล้างรายการทั้งหมด?')) return;
  items = [];
  renderItems();
}

// ── Save ──────────────────────────────────────────────
async function saveAll() {
  if (!items.length) return;
  var btn = document.getElementById('btnSave');
  btn.disabled = true;
  btn.textContent = '⏳ กำลังบันทึก...';

  var channel = document.getElementById('channelSel').value;
  var ref = document.getElementById('refInput').value.trim();
  var errors = [];

  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    try {
      var r = await fetch(cfg.workerUrl + '/api/stock/transaction', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          type: mode,
          name: it.name,
          barcode: it.barcode,
          qty: it.qty,
          piecesPerUnit: it.piecesPerUnit,
          channel: channel,
          ref: ref,
          employee: currentEmployee
        })
      });
      if (!r.ok) errors.push(it.name);
    } catch(e) {
      errors.push(it.name);
    }
  }

  if (errors.length) {
    toast('❌ บันทึกไม่สำเร็จ: ' + errors.length + ' รายการ');
    btn.disabled = false;
    btn.textContent = mode === 'in' ? '💾 บันทึกรับเข้า' : '💾 บันทึกขายออก';
    return;
  }

  addLog('saved', 'บันทึกสำเร็จ', items.length + ' รายการ · ' + items.reduce(function(s,it){return s+it.totalPieces;},0).toLocaleString() + ' ชิ้น · ' + channel);
  toast('✅ บันทึกสำเร็จ ' + items.length + ' รายการ');
  items = [];
  renderItems();
  document.getElementById('refInput').value = '';
  setMode(mode);
}

// ── Log ───────────────────────────────────────────────
function addLog(type, code, msg) {
  var list = document.getElementById('logList');
  if (logEmpty) { list.innerHTML = ''; logEmpty = false; }
  var time = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  var el = document.createElement('div');
  el.className = 'log-entry ' + type;
  el.innerHTML = '<div class="log-bc">' + code + '</div>'
    + '<div class="log-msg">' + msg + '</div>'
    + '<div class="log-time">' + time + '</div>';
  list.insertBefore(el, list.firstChild);
}

function clearLog() { document.getElementById('logList').innerHTML = '<div style="text-align:center;padding:30px;color:var(--text3);font-size:13px;">ยังไม่มีประวัติ</div>'; logEmpty = true; }

// ── Toast ─────────────────────────────────────────────
var _toastTimer = null;
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  if (_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function() { el.classList.remove('show'); }, 2500);
}

// ── Init ──────────────────────────────────────────────
function init() {
  document.getElementById('cfgWorker').value = cfg.workerUrl || '';
  renderItems();
  setTimeout(function() {
    document.getElementById('empModal').style.cssText = 'display:flex;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.8);align-items:center;justify-content:center;';
    setTimeout(function() { document.getElementById('empInput').focus(); }, 100);
  }, 200);
}

init();
</script>
